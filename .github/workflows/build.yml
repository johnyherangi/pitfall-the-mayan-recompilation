# Both shells on the three systems.  The game's files are not in the repository, so the tests
# (ph_tests, which need them) are not run here; the builds prove the code compiles everywhere.
name: build
on: [push, pull_request]
jobs:
  classic-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPITFALL_SHELL=classic
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with: { name: pitfall-windows-classic, path: "build/Release/*.exe" }
  modern-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPITFALL_SHELL=modern
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with: { name: pitfall-windows-modern, path: "build/Release/pitfall.exe" }
  modern-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPITFALL_SHELL=modern
      - run: cmake --build build
      - run: ditto -c -k --keepParent build/Pitfall.app Pitfall-macOS.zip
      - uses: actions/upload-artifact@v4
        with: { name: pitfall-macos, path: Pitfall-macOS.zip }
  modern-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libgl-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPITFALL_SHELL=modern
      - run: cmake --build build
      - uses: actions/upload-artifact@v4
        with: { name: pitfall-linux, path: build/pitfall }
